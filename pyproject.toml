[project]
name = "nogi-face"
version = "0.1.0"
description = "InsightFace (SCRFD + ArcFace) で登録メンバーを判別する推論サーバー"
requires-python = ">=3.12,<3.13"
dependencies = [
    "insightface>=2.1",
    "numpy",
    "opencv-python-headless",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "requests",
    "rich>=15.0.0",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.31"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.31"]
# CUDA 12 向けの onnxruntime-gpu は PyPI では 1.26 が最後（1.27 以降は CUDA 13）。
# ドライバーが CUDA 13 に未対応（nvidia-smi の CUDA Version が 12.x）のマシン用
gpu-cu12 = ["onnxruntime-gpu[cuda,cudnn]>=1.26,<1.27"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "gpu-cu12" }]]
# insightface は onnxruntime と opencv-python を必須で引き込むため，
# extra 側で選んだ runtime / headless 版だけが入るように上書きする
override-dependencies = [
    "onnxruntime>=1.31; extra == 'cpu'",
    "opencv-python; sys_platform == 'never'",
]
