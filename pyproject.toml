[project]
name = "nogi-face"
version = "0.1.0"
description = "InsightFace (SCRFD + ArcFace) で登録メンバーを判別する推論サーバー"
requires-python = ">=3.12,<3.13"
dependencies = [
    "insightface>=2.1",
    # GPU 版だけを使う（GPU / ドライバーが無いマシンでは自動で CPU 実行になる）。
    # 1.26 は CUDA 12 向けの最後の版。NVIDIA ドライバーを 580 以上（CUDA 13 対応）に
    # 更新したら ">=1.31" に上げてよい
    "onnxruntime-gpu[cuda,cudnn]>=1.26,<1.27",
    "numpy",
    "opencv-python-headless",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "requests",
    "rich>=15.0.0",
]

[tool.uv]
# insightface が必須で引き込む CPU 版 onnxruntime と opencv-python を入れない。
# onnxruntime と onnxruntime-gpu は同じ onnxruntime/ にファイルを置くため，両方入ると壊れる
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
]
